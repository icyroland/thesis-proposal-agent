<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>开题引导助手 · Master Thesis Guidance</title>
<style>
  :root{
    --bg:#f3f5f9; --card:#ffffff; --ink:#1f2733; --sub:#6b7686;
    --brand:#2f5fa8; --brand-soft:#e8eefb; --line:#e3e8f0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.6;
  }
  #app{max-width:760px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
  header{
    background:linear-gradient(135deg,#2f5fa8,#3d7bb8);color:#fff;
    padding:14px 18px 12px;flex:0 0 auto;box-shadow:0 2px 10px rgba(31,51,90,.15);
  }
  .hrow{display:flex;align-items:center;gap:10px}
  .logo{font-size:26px}
  .htxt{flex:1;min-width:0}
  .htxt h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.5px}
  .htxt .sub{font-size:12px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbtns{display:flex;gap:6px}
  .hbtn{
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;
    border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;
  }
  .hbtn:hover{background:rgba(255,255,255,.28)}
  .progress-wrap{margin-top:10px;display:flex;align-items:center;gap:8px}
  .progress-bar{flex:1;height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
  .progress-fill{height:100%;width:0%;background:#ffd66b;border-radius:3px;transition:width .5s ease}
  .progress-label{font-size:11px;opacity:.9;white-space:nowrap}
  main#chat{flex:1 1 auto;overflow-y:auto;padding:18px 14px 10px;scroll-behavior:smooth}
  .msg{display:flex;gap:8px;margin-bottom:14px;align-items:flex-end}
  .msg.user{justify-content:flex-end}
  .avatar{
    width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:18px;background:#dbe6f7;border:1px solid #c3d3ee;
  }
  .bubble{
    max-width:78%;padding:10px 14px;border-radius:14px;position:relative;
    background:var(--agent);border:1px solid var(--line);box-shadow:0 1px 3px rgba(30,50,90,.06);
    white-space:pre-wrap;word-break:break-word;
  }
  .msg.agent .bubble{border-top-left-radius:4px}
  .msg.user .bubble{background:var(--brand);color:#fff;border:none;border-top-right-radius:4px}
  .bubble b{font-weight:700}
  .typing{display:inline-flex;gap:4px;padding:12px 16px}
  .typing i{width:6px;height:6px;border-radius:50%;background:#9db2d4;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .sheet{max-width:100%;background:#fffdf5;border:1px solid #eadfb8;border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .sheet h2{margin:0 0 6px;font-size:16px;color:#7a5b00}
  .sheet h3{margin:12px 0 4px;font-size:13.5px;color:#8a6d1a;border-left:3px solid #e0b84e;padding-left:8px}
  .sheet p,.sheet li{font-size:13.5px;margin:4px 0;color:#4d4433}
  footer{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  #chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .chip{
    background:var(--brand-soft);color:var(--brand);border:1px solid #c9d8f3;border-radius:16px;
    padding:5px 13px;font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit;
  }
  .chip:hover{background:#d7e3fa}
  .inputbar{display:flex;gap:8px;align-items:flex-end}
  #input{
    flex:1;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;
    font-size:15px;font-family:inherit;max-height:120px;outline:none;background:#fafbfd;
  }
  #input:focus{border-color:var(--brand);background:#fff}
  #send{
    background:var(--brand);color:#fff;border:none;border-radius:12px;padding:10px 18px;
    font-size:15px;cursor:pointer;font-family:inherit;
  }
  #send:disabled{background:#b9c6dd;cursor:not-allowed}
  .foot-hint{font-size:11px;color:var(--sub);text-align:center;margin-top:6px}
  dialog{
    border:none;border-radius:14px;padding:20px;max-width:420px;width:92%;
    box-shadow:0 10px 40px rgba(0,0,0,.2);
  }
  dialog::backdrop{background:rgba(20,30,50,.45)}
  dialog h3{margin:0 0 10px;font-size:16px}
  dialog label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
  dialog input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:monospace}
  dialog .note{font-size:12px;color:var(--sub);background:#f6f8fb;border-radius:8px;padding:8px 10px;margin-top:10px}
  dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  dialog button{border:none;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-plain{background:#eef1f6;color:var(--ink)}
  @media (max-width:480px){
    .bubble{max-width:86%}
    .htxt h1{font-size:15px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="logo">🧭</div>
      <div class="htxt">
        <h1>开题引导助手 <span style="font-weight:400;font-size:12px;opacity:.8">Master Thesis Guidance</span></h1>
        <div class="sub">由助手提问 · 层层聚焦 · 生成你的《开题方向备忘单》</div>
      </div>
      <div class="hbtns">
        <button class="hbtn" id="btn-export" title="导出备忘单与对话记录">导出</button>
        <button class="hbtn" id="btn-restart" title="重新开始">重来</button>
        <button class="hbtn" id="btn-settings" title="配置大模型（可选）">⚙︎</button>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>
      <div class="progress-label" id="plabel">准备开始</div>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <div id="chips"></div>
    <div class="inputbar">
      <textarea id="input" rows="1" placeholder="输入你的回答…（回车发送，Shift+回车换行）"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="foot-hint">对话仅保存在你自己的浏览器本地 · 引导逻辑源自导师一对一开题面谈（2026-10）· 不替代与导师的正式讨论</div>
  </footer>
</div>

<dialog id="settings">
  <h3>⚙︎ 大模型配置（可选）</h3>
  <p style="font-size:13px;color:var(--sub);margin:4px 0">
    不配置也能完整使用：默认走<b>内置规则引导</b>（离线可用）。
    配置任意 OpenAI 兼容接口（如智谱 GLM）后，助手的追问语气会更自然、总结更个性化。密钥只保存在本机浏览器。
  </p>
  <label>接口地址 Base URL</label>
  <input id="cfg-base" placeholder="https://open.bigmodel.cn/api/paas/v4">
  <label>API Key</label>
  <input id="cfg-key" type="password" placeholder="留空 = 使用内置规则模式">
  <label>模型 Model</label>
  <input id="cfg-model" placeholder="glm-4-flash">
  <div class="note">提示：如果你是部署者（导师），想让学生免配置使用大模型，需要自行架设一个带密钥的转发接口，把 Base URL 指向它即可。</div>
  <div class="actions">
    <button class="btn-plain" id="cfg-clear">清除配置</button>
    <button class="btn-primary" id="cfg-save">保存</button>
  </div>
</dialog>

<script>
"use strict";
/* =====================================================================
   开题引导助手 —— 引导逻辑提炼自 2026-10-02《Master Thesis Guidance Discussion》
   导师引导路径：行业 → 产品与品牌 → 品牌主困境(CEO/CMO视角) → 4P聚焦 → 理论抓手
                → 方法与数据 → 变量与模型 → 范围界定 → 时间线 → 所需内容清单
   ===================================================================== */

const $ = s => document.querySelector(s);
const chat = $("#chat"), input = $("#input"), sendBtn = $("#send"), chipsEl = $("#chips");
const pfill = $("#pfill"), plabel = $("#plabel");

/* ---------------- 导师立场（从面谈中提炼，规则模式核心判断） ---------------- */
const STANCE = {
  price:   "坦白说，我不建议硕士论文做“价格”：方案谁都能提，但很难验证提得对不对——你能提出建议，却很难说服审稿人这个建议是好的。除非你有独特的验证手段，否则换一个维度更稳。",
  place:   "渠道（Place）我也不建议：理论上不好建模，实践上你作为一个研究者也改不动品牌的渠道体系，两头都难。建议换。",
  product: "产品维度可以做，但先问自己：这个品牌的产品现在还有多大改进空间？如果产品本身已经不差，那问题多半出在“怎么说”而不是“做什么”。真做产品，我们就转向研究消费者对产品各维度的感知与权衡。",
  promo:   "好选择。推广（营销传播）是最可行、文献支撑也最丰富的维度：产品就在那里、价格短期动不了，品牌唯一能快速发力的就是“怎么跟消费者沟通”。",
  survey:  "说实话我不太建议问卷：设计起来最容易，但时间紧、回收质量难保证，数据“人工痕迹”重，答辩时容易被挑战。除非你能说清样本从哪来、多少份、质量怎么控制，否则建议改用自建档案数据。",
  qual:    "纯定性研究（只有访谈/案例）现在越来越难过审，风险偏高。更稳的组合是“定性开头 + 定量收尾”：用不超过 10 人的小样本访谈帮你圈定变量，再上定量验证。",
  archival:"好路线。自建档案数据对硕士论文来说最扎实：数据客观、可得、可控，而且现在可以用 AI 辅助抽取和编码，工作量完全可控。",
  exp:     "实验可以做，而且不用很复杂：做两版帖子（对应两种策略）× 两组被试，验证哪种更有效就够。但实验操纵什么，最好先从档案数据里获得直觉。",
  second:  "可以，但要先确认三件事：数据覆盖你的品牌和时间段吗？指标是原始数据还是已加工？你拿得到授权吗？三者都过关就继续；任何一条存疑，自建档案数据是更可控的备选。",
  elm:     "ELM（精加工可能性模型）本身没错，但它被用得太滥，审稿人容易审美疲劳。可以把“中心/边缘路径”当作给传播内容归类的框架之一，主理论建议配一个更贴合你数据的。",
  tooSimple:"预警：只有一两个预测变量的模型，对硕士论文来说太单薄了。往这几个方向加变量：内容主题类型、媒介形式（图文/视频、长文/短文）、发布渠道、诉求策略（情感 vs 功能）、原产国叙事（“德国制造”式话语）。",
  sig:     "记住一条底线：假设不必全部显著，但至少要有一个核心假设显著——全部不显著，论文就很难收尾。假设要逐条检验、分开报告。",
  scope:   "把范围收窄到社交媒体完全成立，理由也是现成的：经典品牌正试图在社媒上争夺年轻世代的注意力，这是它们的主战场。单品牌就够——研究站在该品牌管理者的视角，问题自然聚焦。",
  proposal:"开题报告不用过度加工：把我们已经定下来的内容填进学校模板就行。你的主战场是论文本身。"
};

/* ---------------- 阶段定义 ---------------- */
const GREETING = "你好！我是你的<b>开题引导助手</b> 🧭。接下来的十几分钟，由我来提问，帮你把选题一步步收敛成一份可以动手的开题方向。\n\n我们会走过 10 个关口：行业 → 产品与品牌 → 品牌主困境 → 营销维度 → 理论 → 方法与数据 → 模型变量 → 范围 → 时间线 → 材料盘点。\n\n三条规则：\n1️⃣ 我问，你答。不确定就直说“不确定”，我会给你选项；\n2️⃣ 每一步先定下来再走下一步，之后随时可以反悔重来；\n3️⃣ 走完全部关口，我给你一份《开题方向备忘单》：研究问题、理论、数据计划、所需材料清单，一次配齐。\n\n对话只存在你自己的浏览器里，放心聊。准备好了我们出发 🚗";

function brandChips(ind){
  const t=ind||"";
  if(/汽车|新能源|电车|车/.test(t)) return ["宝马","奔驰","奥迪","大众","比亚迪","蔚来"];
  if(/美妆|护肤|化妆/.test(t)) return ["妮维雅","欧莱雅","兰蔻","雅诗兰黛","珀莱雅","完美日记"];
  if(/家电|电器|冰箱|洗衣机/.test(t)) return ["西门子","博世","海尔","美的","小米","格力"];
  if(/食品|饮料|快消|咖啡|茶|奶/.test(t)) return ["可口可乐","农夫山泉","星巴克","瑞幸","伊利","元气森林"];
  if(/运动|服装|服饰|鞋/.test(t)) return ["耐克","阿迪达斯","安踏","李宁","优衣库","lululemon"];
  return [];
}

const STAGES = [
{ id:"industry", label:"行业",
  q:["我们从最具体的一步开始：**你现在身处哪个行业，或者对哪个行业最感兴趣？**\n\n选行业的三个标准：你自己有体感（实习 / 消费 / 身边观察）、市场里有故事可讲、数据拿得到。拿不准就点「帮帮我」。"],
  chips:["汽车","美妆护肤","家电","食品饮料","帮帮我"],
  handle(a,S){
    const t=a.trim();
    if(/帮帮我|不知道|没想好|都可以|没想法/.test(t)){
      return {msgs:["那我给你三个常被选中的行业，都符合“有体感、有故事、有数据”：\n① <b>汽车</b>——外资品牌 vs 本土新能源，品牌光环变化最剧烈；\n② <b>美妆护肤</b>——国际大牌 vs 国货崛起，传播打法迭代快；\n③ <b>家电</b>——外资高端 vs 国产性价比，市场地位正被改写。\n\n说实话，选哪个都能做出好论文——<b>不用纠结，选你现在最有感觉的一个，之后随时可以换</b>。"],chips:["汽车","美妆护肤","家电","食品饮料"],stay:true};
    }
    if(t.length<2){
      return {msgs:["给我一个具体行业名（比如：汽车、美妆护肤、家电、食品饮料、运动服饰……）"],chips:["汽车","美妆护肤","家电","食品饮料","帮帮我"],stay:true};
    }
    S.industry=t;
    return {msgs:["好，行业锁定为「"+t+"」。\n下一步，缩小到具体的产品和品牌。"]};
  }
},
{ id:"brand", label:"产品与品牌",
  q:["好——行业定了。这个行业里，你对哪个<b>产品或品牌</b>最感兴趣、最熟悉？\n\n建议只选一个品牌：单品牌好做深，数据也好收。"],
  chips:(S)=>brandChips(S.industry),
  handle(a,S){
    const t=a.trim();
    if(t.length<2){
      return {msgs:["说出一个具体的品牌名吧——选你觉得“最能说明问题”的那一个，不用贪多。"],chips:brandChips(S.industry),stay:true};
    }
    S.brand=t;
    return {msgs:["很好，<b>行业和品牌都定了，就不要再摇摆</b>——之后随时可以回来换，但现在我们锁定它：你的研究就围绕「"+t+"」展开。\n接下来换一个视角，这是整场开题里最重要的一步。"]};
  }
},
{ id:"dilemma", label:"品牌主困境",
  q:["现在请你换到品牌主的位置上：**假设你就是这个品牌的负责人（CEO / CMO）**——\n\n眼下面临的、最让你头疼的<b>管理或营销困境</b>是什么？\n\n提示：好开题都长这样——“我是谁（品牌）+ 我卡在哪（具体困境）”。从实践问题出发，而不是从“学术空白”出发，审稿人喜欢有现实抓手的题目。"],
  chips:["品牌光环在褪色，老话术不管用了","本土竞争者抢走了年轻顾客","新品类/新市场打不开局面"],
  handle(a,S){
    const t=a.trim();
    if(t.length<10){
      return {msgs:["再展开一点：站在负责人的位置，这个困境具体卡在哪？（比如：花了钱没声量、老话术没人听、年轻人不认、被竞品抢了心智……）"],stay:true};
    }
    S.dilemma=t;
    const msgs=[];
    if(/政治|国际关系|中美|外交|贸易战|地缘/.test(t)){
      msgs.push("这个话题带点宏观政治色彩对吧？处理办法是把它<b>“控制住”</b>：在研究设计里声明政治环境为背景常量，只聚焦消费者层面的具体问题。不用担心，这是标准做法。");
    }
    msgs.push("那这个困境<b>现在有多严重</b>？你手头有没有能佐证的证据——销量或份额下滑、财报、行业报告、社媒口碑变化的例子？\n\n有就记下来，这就是你“研究背景”部分的第一段；没有也没关系——<b>这就是你要去补的第一份材料</b>（市场报告 / 年报），我会在最后的备忘单里替你记上。");
    return {msgs, stay:true, chips:["没有证据，帮我记上","我有一些证据"], probe:"evidence"};
  },
  probe:{evidence(a,S){
    S.evidence = /帮我记上|没有/.test(a) ? "（待补充：市场报告 / 财报数据）" : a.trim();
    return {msgs:["好——困境找到了，这就是你论文的“魂”。\n接下来我们决定：在营销的哪个维度上动手解决它。"]};
  }}
},
{ id:"p4", label:"4P 聚焦",
  q:["营销上能动手的无非四个维度：**产品 Product、价格 Price、渠道 Place、推广 Promotion**。\n\n硕士论文只聚焦<b>其中一个</b>——贪多必败。结合你刚才的困境，你想选哪个？为什么？"],
  chips:["产品","价格","渠道","推广（营销传播）","帮我判断"],
  handle(a,S){
    const t=a.trim();
    if(/帮我判断|帮我选|不知道/.test(t)){
      return {msgs:["那我给你一张决策卡：\n• <b>产品</b>：产品还有明显改进空间时才选它；\n• <b>价格</b>：基本不选（难验证）；\n• <b>渠道</b>：基本不选（难落地）；\n• <b>推广</b>：最稳妥——产品就在那里、价格动不了，唯一能快速发力的就是沟通。\n\n结合你的问题，多数情况下我会指<b>推广</b>。你觉得呢？"],chips:["推广（营销传播）","产品","还是想选价格","还是想选渠道"],stay:true};
    }

let S = {};
let stageIdx = 0;
let finished = false;
let started = false;
let pendingProbe = null;
let revisitJump = false;
let hist = [];
let busy = false;

const LS_KEY = "tpa_state_v2";
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({S,stageIdx,finished,started,pendingProbe,hist})); }catch(e){} }
function load(){
  try{
    const raw=localStorage.getItem(LS_KEY); if(!raw) return false;
    const d=JSON.parse(raw); if(!d||!d.hist||!d.hist.length) return false;
    S=d.S||{}; stageIdx=d.stageIdx||0; finished=!!d.finished; started=!!d.started;
    pendingProbe=d.pendingProbe||null; hist=d.hist||[]; return true;
  }catch(e){ return false; }
}

      ]
    };
    const url = (cfg.base||"https://open.bigmodel.cn/api/paas/v4").replace(/\/+$/,"") + "/chat/completions";
    const r = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},body:JSON.stringify(body)});
    if(!r.ok) return bullet;
    const j = await r.json();
    const txt = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    return (txt&&txt.trim()) ? txt.trim() : bullet;
  }catch(e){ return bullet; }
}

/* ---------------- 渲染 ---------------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function userHtml(raw){ return esc(raw).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>"); }
function md(s){ return s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>"); }
function addMsg(role, html, record=true){
  const div=document.createElement("div");
  div.className="msg "+role;
  div.innerHTML = role==="agent"
    ? '<div class="avatar">🧭</div><div class="bubble">'+html+'</div>'
    : '<div class="bubble">'+html+'</div>';
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  if(record) hist.push({role, html});
}
function addTyping(){
  const div=document.createElement("div");
  div.className="msg agent"; div.id="typing";
  div.innerHTML='<div class="avatar">🧭</div><div class="bubble typing"><i></i><i></i><i></i></div>';
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}
function delTyping(){ const t=$("#typing"); if(t) t.remove(); }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function agentSay(parts, delay=650){
  busy=true; input.disabled=true; sendBtn.disabled=true; chipsEl.innerHTML="";
  for(const p of parts){
    addTyping(); await sleep(delay + Math.min(p.length*6,900));
    delTyping();
    const html = await polish(md(p), stageLabel(), "");
    addMsg("agent", html);
  }
  busy=false; input.disabled=false; sendBtn.disabled=false; save();
}
function stageLabel(){
  if(finished) return "完成 · 备忘单";
  return "第 "+(stageIdx+1)+"/"+STAGES.length+" 关 · "+STAGES[stageIdx].label;
}
function updateProgress(){
  if(finished){ pfill.style.width="100%"; plabel.textContent="✅ 已生成备忘单"; return; }
  const pct = started ? Math.round(((stageIdx)/STAGES.length)*100) : 0;
  pfill.style.width=pct+"%";
  plabel.textContent = started ? stageLabel() : "准备开始";
}
function showChips(list){
  chipsEl.innerHTML="";
  (list||[]).forEach(c=>{
    const b=document.createElement("button"); b.className="chip"; b.textContent=c;
    b.onclick=()=>{ if(busy) return; input.value=c; doSend(); };
    chipsEl.appendChild(b);
  });
}

/* ---------------- 流程引擎 ---------------- */
async function runStageQ(){
  const st=STAGES[stageIdx];
  updateProgress();
  await agentSay(typeof st.q==="function"?st.q(S):st.q);
  showChips(typeof st.chips==="function"?st.chips(S):st.chips);
  save();
}

async function handleAnswer(text){
  const st=STAGES[stageIdx];
  if(/^重新开始$/.test(text.trim())){ restart(); return; }
  if(/^跳过$/.test(text.trim())){
    S[st.id]=(S[st.id]||"")+"（暂定）";
    await agentSay(["好，这步先标记为“暂定”，之后随时回来改。我们继续。"]);
    return advance();
  }

  if(pendingProbe && pendingProbe.stageId===st.id && st.probe && st.probe[pendingProbe.key]){
    const fn=st.probe[pendingProbe.key];
    pendingProbe=null;
    const r=fn(text,S);
    if(r.set) Object.assign(S,r.set);
    await agentSay(r.msgs);
    if(r.stay){ if(r.probe) pendingProbe={stageId:st.id,key:r.probe}; showChips(r.chips); save(); return; }
    return advance();
  }

  const r=st.handle(text,S);
  if(r.set) Object.assign(S,r.set);
  await agentSay(r.msgs);
  if(r.stay){
    if(r.probe) pendingProbe={stageId:st.id,key:r.probe};
    showChips(r.chips); save(); return;
  }
  advance();
}

async function advance(){
  if(revisitJump){ revisitJump=false; return finish(true); }
  stageIdx++;
  if(stageIdx>=STAGES.length){ return finish(false); }
  pendingProbe=null;
  await runStageQ();
}

/* ---------------- 最终备忘单 ---------------- */
function g(k,fb){ return (S[k]&&String(S[k]).trim())||fb||"（待定）"; }
function rq(){
  const p4=g("p4","");
  const subj=g("brand")||g("industry");
  const map={
    "推广（营销传播）":"什么样的传播策略更能提升目标消费者的互动与认同",
    "产品（消费者感知与权衡）":"消费者对产品的感知与权衡如何影响其购买决策",
    "价格（坚持，需设计验证手段）":"价格策略如何影响目标消费者的反应",
    "渠道（坚持，需收窄为具体触点问题）":"渠道触点的经营策略如何影响目标消费者"
  };
  const core=map[p4]||"该维度的哪些策略更能有效触达并说服目标消费者";
  return subj+"情境下，"+core+"？";
}
function appendSheetDiv(html){
  const old=$("#sheet"); if(old) old.remove();
  const div=document.createElement("div");
  div.className="sheet"; div.id="sheet";
  div.innerHTML=html
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/^# (.+)$/m,"<h2>🎓 $1</h2>")
    .replace(/^## (.+)$/gm,"<h3>$1</h3>")
    .replace(/^&gt; (.+)$/gm,"<p style='color:#8a7a4d'>$1</p>")
    .replace(/^- /gm,"• ")
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/\n/g,"<br>");
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  return div;
}
function buildSheet(){
  const d=new Date(), pad=n=>String(n).padStart(2,"0");
  const ts=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  return "# 开题方向备忘单\n"
  +"> 由「开题引导助手」根据对话整理 · "+ts+" · 供开题与导师讨论使用\n\n"
  +"## 一、开题方向（一句话版）\n"
  +"围绕 **"+g("brand")+"**（"+g("industry")+"行业），从 **"+g("p4")+"** 维度切入，以 **"+g("method")+"** 展开，解决品牌主困境「"+g("dilemma")+"」，研究问题可表述为：**"+rq()+"**\n\n"
  +"## 二、研究背景与问题\n"
  +"- **行业**："+g("industry")+"\n"
  +"- **产品与品牌**："+g("brand")+"\n"
  +"- **品牌主困境（CEO/CMO 视角）**："+g("dilemma")+"\n"
  +"- **困境严重性的证据**："+g("evidence")+"\n\n"
  +"## 三、研究设计\n"
  +"- **聚焦维度（4P）**："+g("p4")+"\n"
  +"- **理论抓手**："+g("theory")+"\n"
  +"- **方法与数据**："+g("method")+"\n"
  +"- **数据计划**："+g("dataPlan","官方账号 · 近一年 · 仅图文帖 · 300-400 条（建议值）")+"\n"
  +"- **变量与模型**："+g("model")+"\n"
  +"- **研究范围**："+g("scope")+"\n"
  +"- **假设底线**：至少一个核心假设显著；假设逐条检验、分开报告\n\n"
  +"## 四、时间线\n"
  +"- "+g("timeline")+"\n"
  +"- 未来 1-2 个月：抽数据 → 编码 → 跑模型（不要先写文献综述）\n"
  +"- 写作顺序：引言 → 方法 → 文献综述 → 结果 → 结论\n\n"
  +"## 五、所需内容清单\n"
  +"- 📖 **文献**：理论经典文献；近 5 年同方法实证 3 篇以上（照其变量表搭编码表）\n"
  +"- 🗂 **数据**："+g("dataPlan","官方账号近一年帖子")+"（AI 辅助编码 + 10% 人工复核）\n"
  +"- 🛠 **工具**：Excel（编码）；SPSS / Stata / R 任一（回归）\n"
  +"- 📄 **参照论文**：向导师索取用同样方法完成的往届论文 1-2 篇\n"
  +"- 📋 **开题材料**：学校开题模板（本备忘单内容直接填入）\n"
  +"- ⚠️ **已识别缺口**："+g("gaps","无重大缺口")+"\n\n"
  +"## 六、下一步三件事\n"
  +"1. 把本备忘单填入开题模板，完成开题提交；\n"
  +"2. 启动数据抽取与编码（未来 1-2 个月的核心任务）；\n"
  +"3. 与导师确认参照论文、模板与阶段性检查点。\n\n"
  +"---\n*本备忘单由对话自动生成，所有“待定/暂定”项请在与导师讨论后补齐。*";
}

async function finish(fromRevisit){
  finished=true; pendingProbe=null; updateProgress();
  const old=$("#sheet"); if(old) old.remove();
  hist=hist.filter(h=>!h.sheet);
  await agentSay([fromRevisit?"改好了 ✅《开题方向备忘单》已按最新内容更新——":"全部关卡走完 🎉 我把我们的对话整理成了《开题方向备忘单》——"],500);
  const html=buildSheet();
  appendSheetDiv(html);
  hist.push({role:"agent",html,sheet:true});
  chat.scrollTop=chat.scrollHeight;
  await agentSay([
    "点「导出」可以把备忘单和完整对话一起带走。",
    cfg.key
      ? "接下来你可以随意追问或修改——直接说「改第几关」或关卡名（比如「改方法」），我们就回到那里重来。"
      : "想修改哪一步，直接说「改第几关」或关卡名（比如「改方法」），我们就回到那里重来；或者点下面的按钮。"
  ]);
  showChips(["重新走一遍","我要修改某一步","复制备忘单"]);
  save();
}

/* 重访某阶段（修改） */
const KEYMAP={"行业":0,"产品":1,"品牌":1,"困境":2,"实践":2,"问题":2,"cmo":2,"4p":3,"维度":3,"价格":3,"渠道":3,"推广":3,"理论":4,"方法":5,"数据":5,"模型":6,"变量":6,"范围":7,"时间":8,"毕业":8,"材料":9,"清单":9,"文献":9};
async function revisit(text){
  let idx=-1;
  const m=/第\s*(\d+)\s*关/.exec(text);
  if(m){ const n=parseInt(m[1]); if(n>=1&&n<=STAGES.length) idx=n-1; }
  else { const low=text.toLowerCase(); for(const k in KEYMAP){ if(low.includes(k)){ idx=KEYMAP[k]; break; } } }
  if(idx<0){ await agentSay(["告诉我要改哪一关：说「第 N 关」或关卡名（兴趣 / 行业 / 实践问题 / 4P / 理论 / 方法 / 模型 / 范围 / 时间线 / 清单）。"],400); return; }
  const key=STAGES[idx].id;
  await agentSay(["好，我们回到 **"+STAGES[idx].label+"**。之前你定的是：「"+(S[key]||"（空）")+"」。\n现在说说你想怎么改？"],400);
  finished=false; stageIdx=idx; pendingProbe=null; revisitJump=true;
  const st=STAGES[idx];
  if(idx===1&&S._industryRaw){ S._industryRaw=""; S.industry=""; } // 允许重选行业
  showChips(typeof st.chips==="function"?st.chips(S):st.chips);
  updateProgress(); save();
}

/* ---------------- 发送与输入 ---------------- */
async function doSend(){
  const text=input.value.trim();
  if(!text||busy) return;
  input.value=""; input.style.height="auto";
  addMsg("user",userHtml(text),true);
  save();
  try{
    if(finished){
      if(/重新走一遍|重来/.test(text)){ return restart(); }
      if(/复制备忘单/.test(text)){ return copySheet(); }
      return revisit(text);
    }
    await handleAnswer(text);
  }catch(e){
    await agentSay(["（出了点小故障："+(e&&e.message||e)+"——再说一次试试。）"]);
  }
}
sendBtn.onclick=doSend;
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); doSend(); }
});
input.addEventListener("input",()=>{ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,120)+"px"; });

/* ---------------- 导出 / 复制 / 重启 ---------------- */
function download(name,content){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type:"text/markdown;charset=utf-8"}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function transcriptText(){
  return hist.map(h=>(h.role==="agent"?"【助手】":"【学生】")+"\n"+h.html.replace(/<br\s*\/?>/g,"\n").replace(/<[^>]+>/g,"").replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&amp;/g,"&")).join("\n\n");
}
function copySheet(){
  const mdText=buildSheet();
  const p = navigator.clipboard ? navigator.clipboard.writeText(mdText) : Promise.reject();
  p.then(()=>agentSay(["备忘单已复制到剪贴板 ✅ 可以直接粘贴给导师或自己存档。"],300))
   .catch(()=>download("开题方向备忘单.md",mdText));
}
$("#btn-export").onclick=()=>{
  if(!hist.length){ alert("还没有对话内容"); return; }
  download("开题引导-对话与备忘单.md", transcriptText()+"\n\n---\n\n"+buildSheet());
};
$("#btn-restart").onclick=()=>{ if(confirm("确定重新开始？当前对话将被清空。")) restart(); };
function restart(){
  localStorage.removeItem(LS_KEY);
  S={}; stageIdx=0; finished=false; started=true; pendingProbe=null; revisitJump=false; hist=[];
  chat.innerHTML="";
  startFresh();
}

/* ---------------- 设置 ---------------- */
const dlg=$("#settings");
$("#btn-settings").onclick=()=>{
  $("#cfg-base").value=localStorage.getItem("tpa_base")||"";
  $("#cfg-key").value=localStorage.getItem("tpa_key")||"";
  $("#cfg-model").value=localStorage.getItem("tpa_model")||"";
  dlg.showModal();
};
$("#cfg-save").onclick=()=>{
  localStorage.setItem("tpa_base",$("#cfg-base").value.trim());
  localStorage.setItem("tpa_key",$("#cfg-key").value.trim());
  localStorage.setItem("tpa_model",$("#cfg-model").value.trim());
  dlg.close();
  agentSay([cfg.key?"大模型已启用 ✅ 之后的回复会更有温度。":"已保存。当前为内置规则模式，无需联网即可使用。"],300);
};
$("#cfg-clear").onclick=()=>{
  ["tpa_base","tpa_key","tpa_model"].forEach(k=>localStorage.removeItem(k));
  dlg.close(); agentSay(["已清除大模型配置，回到内置规则模式。"],300);
};

/* ---------------- 启动 ---------------- */
async function startFresh(){
  started=true; updateProgress();
  await agentSay([GREETING]);
  runStageQ();
}
if(load()){
  hist.forEach(h=>{ if(h.sheet) appendSheetDiv(h.html); else addMsg(h.role,h.html,false); });
  updateProgress();
  if(finished) showChips(["重新走一遍","我要修改某一步","复制备忘单"]);
  else { const st=STAGES[stageIdx]; showChips(typeof st.chips==="function"?st.chips(S):st.chips); }
  addMsg("agent","（已恢复上次的对话进度，接着聊就行。）",false);
}else{
  startFresh();
}
</script>
